name: Test

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - main
      - master

jobs:
  test:
    name: Check, build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # Same major as the Dockerfile's base image
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Run linter
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Run unit tests
        run: pnpm test

      - name: Run e2e tests
        run: pnpm test:e2e

  image:
    name: Build image reproducibly
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build twice and compare digests
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          for i in 1 2; do
            docker buildx build --no-cache --platform linux/amd64 \
              --provenance=false --sbom=false \
              --build-arg SOURCE_DATE_EPOCH \
              --output type=oci,dest=/tmp/image-$i.tar,rewrite-timestamp=true \
              --metadata-file /tmp/metadata-$i.json .
          done
          first=$(jq -r '."containerimage.digest"' /tmp/metadata-1.json)
          second=$(jq -r '."containerimage.digest"' /tmp/metadata-2.json)
          echo "First build:  $first"
          echo "Second build: $second"
          [ "$first" = "$second" ]

  contracts:
    name: Check and test the governance contracts
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: contracts

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm

      # OpenZeppelin and forge-std come from node_modules, pinned by the lockfile
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Check formatting
        run: forge fmt --check

      - name: Run tests
        run: forge test -vvv
