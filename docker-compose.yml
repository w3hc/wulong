version: '3.8'

services:
  wulong:
    # v0.2.0, pinned by digest so the attested compose hash commits to the image.
    # Take the digest from the release notes, see docs/DOCKER.md#releases.
    image: ghcr.io/w3hc/wulong@sha256:aad851009d227b9358301f850bc45946b5a477785d0e1a7ce385e11ccc850778
    ports:
      - "3000:3000"
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - wulong-data:/app/data
    environment:
      - NODE_ENV=${NODE_ENV}
      - CHEST_PATH=/app/data/chest.json
      - CORS_ORIGINS=${CORS_ORIGINS}
      - SIWE_DOMAIN=${SIWE_DOMAIN}
      # Gateway hostnames the in-enclave TLS certificate is issued for, e.g.
      # <app-id>-3000s.<gateway-domain>. The trailing "s" puts the gateway in TLS
      # passthrough mode, so TLS terminates in this container.
      # ALLOW_TLS_OUTSIDE_ENCLAVE is deliberately not passed through: opting out
      # takes a compose change, which changes the attested compose hash.
      - TLS_ALT_NAMES=${TLS_ALT_NAMES}
      # Once WulongAnchor is deployed, set these as literals, never ${...}, so the
      # compose hash commits to them. See docs/GOVERNANCE.md#anchor.
      # - WULONG_ANCHOR_ADDRESS=0x...
      # - BASE_RPC_URL=https://...
    restart: unless-stopped

volumes:
  wulong-data:
